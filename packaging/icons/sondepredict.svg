<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Sonde Predict: a sounding balloon, its radiosonde, and the predicted descent to a landing pin. -->
  <rect x="8" y="8" width="240" height="240" rx="44" fill="#1e88e5"/>
  <path d="M 8 160 L 248 160 L 248 204 A 44 44 0 0 1 204 248 L 52 248 A 44 44 0 0 1 8 204 Z" fill="#1976d2"/>
  <!-- predicted descent -->
  <g fill="#ffffff">
    <circle cx="124" cy="160" r="6"/>
    <circle cx="145" cy="164" r="6"/>
    <circle cx="164" cy="168" r="6"/>
  </g>
  <!-- balloon, string, sonde -->
  <ellipse cx="96" cy="74" rx="46" ry="52" fill="#ffffff"/>
  <ellipse cx="80" cy="58" rx="14" ry="18" fill="#e3f2fd"/>
  <path d="M 90 124 L 102 124 L 96 132 Z" fill="#ffffff"/>
  <line x1="96" y1="131" x2="96" y2="150" stroke="#ffffff" stroke-width="4"/>
  <rect x="83" y="148" width="26" height="22" rx="5" fill="#ff9800" stroke="#ffffff" stroke-width="3"/>
  <!-- landing pin -->
  <path d="M 188 236 C 180 220, 160 206, 160 188 A 28 28 0 1 1 216 188 C 216 206, 196 220, 188 236 Z"
        fill="#e53935" stroke="#ffffff" stroke-width="5"/>
  <circle cx="188" cy="188" r="10" fill="#ffffff"/>
</svg>
